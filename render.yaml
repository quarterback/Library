# Render deployment configuration
# https://render.com/docs/blueprint-spec
#
# Deploy: connect this repo to Render, it reads this file automatically.
# Or use the Render dashboard and point to the Dockerfile.

services:
  - type: web
    name: library
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: library-db
          property: connectionURI
        # Render provides postgres:// — we need postgresql+asyncpg://
        # Override this in dashboard or use the transform below
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false

databases:
  - name: library-db
    plan: starter
    postgresMajorVersion: "16"
    ipAllowList: []
