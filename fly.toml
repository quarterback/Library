# Fly.io deployment configuration
# Deploy: fly launch, then fly deploy
#
# Required secrets (set via fly secrets set):
#   DATABASE_URL, DATABASE_URL_SYNC, ANTHROPIC_API_KEY, VOYAGE_API_KEY

app = "library"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
